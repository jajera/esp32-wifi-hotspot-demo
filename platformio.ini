; ESP32-C61 WiFi provisioning — Phase 1
; C61 Arduino builds use pioarduino platform (hybrid compile for ESP32-C61).

[platformio]
default_envs = esp32-c61-softap

[common_esp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c61-devkitc1-n8r2
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/set_firmware_version.py
build_flags =
    -Wall

[env:esp32-c61-softap]
extends = common_esp

[env:esp32-c61-ble]
extends = common_esp
build_flags =
    ${common_esp.build_flags}
    -DBLE_TRANSPORT

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=c++17
    -Wall
    -DUNIT_TEST
    -Itest/support
build_src_filter =
    +<validation.cpp>
    +<identifiers.cpp>
    +<state_logic.cpp>
    -<main.cpp>
    -<provisioning.cpp>
    -<nvs_store.cpp>
    -<led_status.cpp>
    -<boot_button.cpp>
    -<captive_portal.cpp>
    -<ble_prov.cpp>
    -<app_main.cpp>
    -<logging.cpp>
